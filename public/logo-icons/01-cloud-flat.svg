  <g fill="#00e5c8">
    <circle cx="92"  cy="118" r="34"/>
    <circle cx="128" cy="100" r="42"/>
    <circle cx="164" cy="122" r="32"/>
    <rect x="64" y="118" width="120" height="40" rx="20"/>
  </g>
</svg>
