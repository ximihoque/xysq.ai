<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="xysq squircle q-squared">
  <!-- 10 — Squircle q². The cleanest tie to the xysq² wordmark: a cyan→lychee
       gradient app-tile with a single bold q and a superscript 2. App-store ready. -->
  <defs>
    <linearGradient id="g10" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5c8"/>
      <stop offset="1" stop-color="#ff6b7a"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="56" fill="url(#g10)"/>
  <g font-family="'Outfit','Helvetica Neue',Arial,sans-serif" font-weight="800" fill="#0a121c" text-anchor="middle">
    <text x="112" y="166" font-size="118">q</text>
    <text x="178" y="104" font-size="48">2</text>
  </g>
</svg>
