<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020408" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)" />

    <!-- every SEO tag is emitted per-page by <SEO/>. helmet can't dedupe
         tags hardcoded here, so anything repeated ships twice and the stale
         copy can win. only put tags here that <SEO/> never emits. -->
    <meta name="twitter:site" content="@xysqai" />

    <!-- Schema.org: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "xysq",
      "url": "https://xysq.ai",
      "logo": "https://xysq.ai/logo.svg",
      "description": "Build reliable agents on the most capable context platform. Every fact keeps the source it came from, the old version closes when something changes, and you decide who sees what.",
      "sameAs": [
        "https://x.com/xysqai"
      ]
    }
    </script>

    <!-- Schema.org: WebSite (enables sitelinks searchbox) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "xysq.ai",
      "url": "https://xysq.ai"
    }
    </script>

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- DNS prefetch for clickthrough destinations -->
    <link rel="dns-prefetch" href="https://app.xysq.ai" />
    <link rel="dns-prefetch" href="https://docs.xysq.ai" />

    <!-- Fonts: Outfit (headings + body) and JetBrains Mono (code/labels).
         Playfair Display is intentionally NOT loaded anymore — the serif
         headings were retired for one consistent sans. print-then-swap keeps
         the stylesheet non-render-blocking while still applying once loaded. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono&display=swap"
      />
    </noscript>

    <!-- Theme: set before render to avoid flash.
         Default is light ("day") per product preference. Honors a
         previously-saved choice if the user has toggled. -->
    <script>
      (function() {
        var t = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8DSV3570ZQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-8DSV3570ZQ');
    </script>

    <!-- Apollo website tracker -->
    <script>
      function initApollo(){var n=Math.random().toString(36).substring(7),o=document.createElement("script");
      o.src="https://assets.apollo.io/micro/website-tracker/tracker.iife.js?nocache="+n,o.async=!0,o.defer=!0,
      o.onload=function(){window.trackingFunctions.onLoad({appId:"6a1c86f4818b340010ea7c15"})},
      document.head.appendChild(o)}initApollo();
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
